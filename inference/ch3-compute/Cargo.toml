[package]
name = "ch3-compute"
version = "0.1.0"
edition = "2021"
# Independent runnable samples are declared explicitly below via [[bin]],
# so files don't need to live under the src/bin/ or examples/ auto-discovery
# directories.
autobins = false

[dependencies]
candle-core = { version = "0.11" }
candle-nn = "0.11"

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = { version = "0.11", features = ["cuda"] }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["metal"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "benchmark_gemm"
path = "benchmark_gemm.rs"

[[bin]]
name = "benchmark_gemv"
path = "benchmark_gemv.rs"

[[bin]]
name = "benchmark_gemm_metal"
path = "benchmark_gemm_metal.rs"

[[bin]]
name = "benchmark_gemv_metal"
path = "benchmark_gemv_metal.rs"
